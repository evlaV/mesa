stages:
- base-containers
- build
- RADV

# Disable all unwanted pipelines
workflow:
  rules:
    # Do not run on tags
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - when: always

# Only run on the CI branch
.base-containers-rules:
  rules:
    - if: '$CI_COMMIT_REF_NAME == "ci"'
      when: on_success
    - when: never

# Run on all other branches, but the CI one
.test-rules:
  variables:
    # Common test options
    CI_TRON_ACO_DEBUG: validateir,validatera
  rules:
    - if: '$CI_COMMIT_REF_NAME == "ci"'
      when: never

    # Stable
    - if: '$CI_COMMIT_BRANCH == "steamos-24.11"'
      when: on_success
      variables:
        JUPITER_VERSION: "3.7"
        BASE_IMAGE_TAG: !reference [jupiter-3.7-base, variables, IMAGE_TAG]
        BASE_IMAGE: $CI_REGISTRY_IMAGE/jupiter-3.7-base:$BASE_IMAGE_TAG
        COMPILE_LIBDRM_WITH_MESA: "0"
        CI_TRON_RADV_PERFTEST: "transfer_queue"
        CI_TRON_KERNEL_URL: https://fs.mupuf.org/linux-6.6-b2c-radv-ci
        GPU_VERSION_SUFFIX: -aco
        # CI_TRON_KERNEL_URL: 'https://steamdeck-packages.steamos.cloud/archlinux-mirror/jupiter-3.6/os/x86_64/linux-neptune-65-6.5.0.valve20-1-x86_64.pkg.tar.zst'
        # CI_TRON_FIRMWARE_URL: 'https://steamdeck-packages.steamos.cloud/archlinux-mirror/jupiter-3.6/os/x86_64/linux-firmware-neptune-jupiter.20231113.1-1-any.pkg.tar.zst'
        # CI_TRON_UCODE_URL: 'https://steamdeck-packages.steamos.cloud/archlinux-mirror/jupiter-3.6/os/x86_64/amd-ucode-jupiter.20231113.1-1-any.pkg.tar.zst'

    # Beta
    # TODO: Create a new container when 3.8 gets branched
    - if: '$CI_COMMIT_BRANCH == "steamos-25.6"'
      when: on_success
      variables:
        JUPITER_VERSION: "main"
        BASE_IMAGE_TAG: !reference [jupiter-main-base, variables, IMAGE_TAG]
        BASE_IMAGE: $CI_REGISTRY_IMAGE/jupiter-main-base:$BASE_IMAGE_TAG
        COMPILE_LIBDRM_WITH_MESA: "0"
        CI_TRON_RADV_PERFTEST: "transfer_queue,video_decode,video_encode"
        CI_TRON_KERNEL_URL: https://fs.mupuf.org/linux-6.6-b2c-radv-ci

    # Default to main
    - when: on_success
      variables:
        JUPITER_VERSION: "main"
        BASE_IMAGE_TAG: !reference [jupiter-main-base, variables, IMAGE_TAG]
        BASE_IMAGE: $CI_REGISTRY_IMAGE/jupiter-main-base:$BASE_IMAGE_TAG
        COMPILE_LIBDRM_WITH_MESA: "0"
        CI_TRON_RADV_PERFTEST: "transfer_queue,video_decode,video_encode"
        CI_TRON_KERNEL_URL: https://fs.mupuf.org/linux-6.6-b2c-radv-ci
        # CI_TRON_KERNEL_URL: 'https://steamdeck-packages.steamos.cloud/archlinux-mirror/jupiter-main/os/x86_64/linux-neptune-68-6.8.12.valve2-1-x86_64.pkg.tar.zst'
        # CI_TRON_FIRMWARE_URL: 'https://steamdeck-packages.steamos.cloud/archlinux-mirror/jupiter-main/os/x86_64/linux-firmware-neptune-jupiter.20240917.1-2-any.pkg.tar.zst'
        # CI_TRON_UCODE_URL: 'https://steamdeck-packages.steamos.cloud/archlinux-mirror/jupiter-main/os/x86_64/amd-ucode-neptune-jupiter.20240917.1-2-any.pkg.tar.zst'

.container-build:
  image: quay.io/buildah/stable
  timeout: 2h
  tags:
    - CI-gateway
    - cpu:cores:16+
  variables:
    # BASE_IMAGE:
    # IMAGE_NAME:
    # IMAGE_TAG:
    # BUILD_SCRIPT:
    IMAGE_LABEL: $CI_REGISTRY_IMAGE/$IMAGE_NAME:$IMAGE_TAG
  script: |
    set -eux

    buildah login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY

    manifest=$(buildah manifest inspect $IMAGE_LABEL 2>&1) || true
    if [[ $manifest == *"manifest unknown"* ]]; then
        # Allow the from container to be located in a private project by allowing
        # the use of an alternative token
        if [ -n "${FROM_CONTAINER_REGISTRY_TOKEN:-}" ]; then
            buildah login -u gitlab-ci-token -p ${FROM_CONTAINER_REGISTRY_TOKEN} $CI_REGISTRY
        fi

        buildcntr=$(buildah from --isolation=chroot $BASE_IMAGE)
        buildmnt=$(buildah mount $buildcntr)

        # HACK: This line will ensure that all jobs have origin/ci's .valve-ci/ folder
        # added in the source tree, allowing access to the CI files without requiring
        # adding commits on top of the branch being tested
        dnf install -y git
        git fetch origin ci && git restore --source origin/ci .valve-ci

        buildah run --isolation chroot --env DEQP_BRANCH=${DEQP_BRANCH:-} --env VKD3D_PROTON_COMMIT=${VKD3D_PROTON_COMMIT:-} --env DEQP_COMMITS_TO_BACKPORT="${DEQP_COMMITS_TO_BACKPORT:-}" --env COMPILE_LIBDRM_WITH_MESA=${COMPILE_LIBDRM_WITH_MESA:-0} --volume $PWD:/app/ --workingdir /app $buildcntr bash $BUILD_SCRIPT

        buildah unmount $buildcntr
        buildah commit --format docker $buildcntr $IMAGE_LABEL
        buildah rm $buildcntr

        # Push to the local registry of the project
        buildah login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY
        buildah push $IMAGE_LABEL || buildah push $IMAGE_LABEL
    else
        echo "The image already exists, nothing to do :)"
    fi

# base-containers stage

.base-container-build:
  stage: base-containers
  extends:
    - .base-containers-rules
    - .container-build
  variables:
    IMAGE_NAME: $CI_JOB_NAME
    BUILD_SCRIPT: .valve-ci/base-container-build.sh

    # Use a read-only registry token to access the steamos image since the
    # job's one can't access the container registry of other private projects
    FROM_CONTAINER_REGISTRY_TOKEN: $STEAMOS_REGISTRY_TOKEN_RO

jupiter-3.7-base:
  extends:
    - .base-container-build
  variables:
    BASE_IMAGE: registry.gitlab.steamos.cloud/steam/steamos-docker-images/jupiter-3.7/base-devel:latest
    DEQP_BRANCH: a9f7069b9a5ba94715a175cb1818ed504add0107
    DEQP_COMMITS_TO_BACKPORT:
    VKD3D_PROTON_COMMIT: 59d6d4b5ed23766e69fe252408a3401d2fd52ce8
    IMAGE_TAG: "2025-05-27.1"

jupiter-main-base:
  extends:
    - .base-container-build
  variables:
    BASE_IMAGE: registry.gitlab.steamos.cloud/steam/steamos-docker-images/jupiter-main/base-devel:latest
    DEQP_BRANCH: f66e0ae866117f3d7375763bf5ec194404d88cdb
    DEQP_COMMITS_TO_BACKPORT:
    VKD3D_PROTON_COMMIT: 041cfa75580090c6b30af2f2721015d15493f14b
    IMAGE_TAG: "2025-06-06.1"


# build stage

jupiter-mesa:
  stage: build
  extends:
    - .test-rules
    - .container-build
  variables:
    IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"
    IMAGE_NAME: jupiter-mesa-$JUPITER_VERSION
    BUILD_SCRIPT: .valve-ci/mesa-build.sh

# RADV stage

.executorctl_test:
  stage: RADV
  image: registry.freedesktop.org/gfx-ci/ci-tron/mesa-trigger:latest
  dependencies: []
  extends:
    - .test-rules
  artifacts:
    when: always
    paths:
      - ${RESULTS_FOLDER}
    exclude:
      - storage   # Work around a b2c bug
    expire_in: 1 week
  variables:
    CI_TRON_INITRAMFS_URL: 'https://gitlab.freedesktop.org/gfx-ci/boot2container/-/releases/v0.9.12.1/downloads/initramfs.linux_amd64.cpio.xz'
    CI_TRON_JOB_SUCCESS_REGEX: 'Execution is over, pipeline status: 0\r$'
    CI_TRON_JOB_WARN_REGEX: 'null'
    CI_TRON_LOG_LEVEL: 6
    CI_TRON_POWEROFF_DELAY: 15
    CI_TRON_SESSION_END_REGEX: '^.*It''s now safe to turn off your computer\r$'
    CI_TRON_SESSION_REBOOT_REGEX: 'GPU hang detected!'
    CI_TRON_TIMEOUT_BOOT_MINUTES: 180
    CI_TRON_TIMEOUT_BOOT_RETRIES: 1
    CI_TRON_TIMEOUT_FIRST_MINUTES: 2
    CI_TRON_TIMEOUT_FIRST_RETRIES: 3
    CI_TRON_TIMEOUT_MINUTES: 3
    CI_TRON_TIMEOUT_OVERALL_MINUTES: 180
    CI_TRON_TIMEOUT_RETRIES: 1
    CI_TRON_JOB_VOLUME_EXCLUSIONS: "*.shader_cache,vkd3d-proton.cache*,*.qpa"
    IMAGE: "${CI_REGISTRY_IMAGE}/jupiter-mesa-${JUPITER_VERSION}:${CI_COMMIT_SHORT_SHA}"
    RESULTS_FOLDER: "${CI_JOB_NAME}-results"
    GIT_STRATEGY: clone
    GIT_SUBMODULE_STRATEGY: none

  timeout: 3h10m
  script:
    # Help debug what is going on
    - env

    - apk add git
    - git fetch origin ci && git restore --source origin/ci .valve-ci

    - python3 .valve-ci/generate_b2c.py --template .valve-ci/b2c.yml.jinja2.jinja2 --job-volume-exclusions "${CI_TRON_JOB_VOLUME_EXCLUSIONS}" --local-container="${IMAGE}" --working-dir "/job"
    - cat b2c.yml.jinja2
    - mkdir "${RESULTS_FOLDER}"
    - env PYTHONUNBUFFERED=1 executorctl run -w b2c.yml.jinja2 -s ${RESULTS_FOLDER}

# Hardware jobs

.jupiter-test:
  extends:
    - .test-rules
    - .executorctl_test
  needs:
    - jupiter-mesa
  variables:
    IMAGE_NAME: jupiter-mesa
    CI_TRON_MUPUF_REGISTRY_USERNAME: ${MUPUF_REGISTRY_USERNAME}
    CI_TRON_MUPUF_REGISTRY_PASSWORD: ${MUPUF_REGISTRY_PASSWORD}

.test-vkcts:
  extends:
    - .jupiter-test
  variables:
    CI_TRON_CONTAINER_CMD: run-vkcts.sh

.test-vkd3d-proton:
  extends:
    - .jupiter-test
  variables:
    CI_TRON_CONTAINER_CMD: run-vkd3d-proton.sh
    CI_TRON_JOB_SUCCESS_REGEX: 'vkd3d-proton execution: SUCCESS\r$'


# VanGogh

.vangogh-test-valve:
  tags:
    - amdgpu:codename:VANGOGH
    - ci-tron:priority:low
  variables:
    CI_TRON_GPU_VERSION: radv-vangogh$GPU_VERSION_SUFFIX
    CI_TRON_CI_JOB_CONCURRENCY: 8
    CI_TRON_CMDLINE_EXTRAS: amd_iommu=off amdgpu.gttsize=8128 b2c.swap=16g

jupiter-vkcts-vangogh:
  extends:
    - .test-vkcts
    - .vangogh-test-valve

jupiter-vkd3d-proton-vangogh:
  extends:
    - .test-vkd3d-proton
    - .vangogh-test-valve


# Navi21

.navi21-test-valve:
  tags:
    - amdgpu:codename:NAVI21
    - priority:low
  variables:
    CI_TRON_GPU_VERSION: radv-navi21$GPU_VERSION_SUFFIX
    CI_TRON_CI_JOB_CONCURRENCY: 32
    CI_TRON_CMDLINE_EXTRAS: b2c.swap=16g

jupiter-vkcts-navi21:
  extends:
    - .test-vkcts
    - .navi21-test-valve

jupiter-vkd3d-proton-navi21:
  extends:
    - .test-vkd3d-proton
    - .navi21-test-valve


# Navi31

.navi31-test-valve:
  tags:
    - amdgpu:codename:NAVI31
    - priority:low
  variables:
    CI_TRON_GPU_VERSION: radv-navi31$GPU_VERSION_SUFFIX
    CI_TRON_CI_JOB_CONCURRENCY: 32
    CI_TRON_CMDLINE_EXTRAS: b2c.swap=16g
    CI_TRON_RADV_DEBUG: nomeshshader

jupiter-vkcts-navi31:
  extends:
    - .test-vkcts
    - .navi31-test-valve

jupiter-vkd3d-proton-navi31:
  extends:
    - .test-vkd3d-proton
    - .navi31-test-valve
